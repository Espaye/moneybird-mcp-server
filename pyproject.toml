[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "moneybird-mcp"
version = "0.4.0"
description = "Read-first MCP server for Moneybird bookkeeping, with experimental supervised writes behind an explicit capability policy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Espaye" }]
keywords = ["moneybird", "mcp", "model-context-protocol", "bookkeeping", "accounting", "invoicing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# Keep in sync with requirements.txt (which stays for the git-clone workflow).
dependencies = [
    "fastmcp>=3.4.5,<4",
    "pydantic>=2.11.7,<3",
    "httpx>=0.28.1,<1",
    "uvicorn>=0.35",
    "chardet>=5,<6",
]

[project.optional-dependencies]
# PDF text-layer extraction for read_document_attachment. Without it the local tool
# reports the missing extra; attachment parsing is disabled in hosted request mode.
pdf = ["pypdf>=6.14.2"]

[project.urls]
Homepage = "https://github.com/Espaye/moneybird-mcp-server"
Repository = "https://github.com/Espaye/moneybird-mcp-server"
Issues = "https://github.com/Espaye/moneybird-mcp-server/issues"

[project.scripts]
moneybird-mcp = "moneybird.server:main"

[tool.hatch.build.targets.wheel]
packages = ["moneybird"]

[tool.hatch.build.targets.sdist]
include = [
    "moneybird",
    "moneybird_mcp_server.py",
    "scripts",
    "tests",
    "docs",
    "mcpb",
    "README.md",
    "CLAUDE.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "SUPPORT.md",
    "CHANGELOG.md",
    ".env.example",
]
exclude = [
    "**/__pycache__",
    # Validation reports contain artifact digests and therefore cannot be part
    # of the sdist whose digest they record.
    "docs/release_validation_*.md",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# The initial gate targets correctness, unused code, and deterministic imports.
# Broader style/complexity families are intentionally deferred so the first
# lint adoption remains reviewable and does not rewrite fail-closed exception
# handling merely to satisfy a metric.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Registration must finish before compact discovery transforms the tool catalog.
"moneybird/tools/__init__.py" = ["E402"]
