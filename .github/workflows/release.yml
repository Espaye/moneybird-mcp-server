name: Release

# Releases are deliberate manual operations. A push or merge never publishes.
# Start this workflow from the repository's default branch and provide the exact
# package version plus the full commit SHA currently at that branch. The workflow
# fails unless both inputs match the checked-out source, PyPI has never seen the
# version, and neither the tag nor GitHub Release exists.
#
# PyPI versions are immutable. This workflow never repairs, overwrites, or reuses an
# existing version. If any publication is partial, stop and choose the next legal
# version after investigating. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish (for example, 0.4.0)
        required: true
        type: string
      commit_sha:
        description: Full 40-character commit SHA currently at the default branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One release state machine for the repository.
  group: release-${{ github.repository }}-main
  # Never cancel a publish that is already under way.
  cancel-in-progress: false

jobs:
  check:
    name: Validate manual release request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish_needed: ${{ steps.check.outputs.publish_needed }}
      tag_needed: ${{ steps.check.outputs.tag_needed }}
      release_needed: ${{ steps.check.outputs.release_needed }}
      work_needed: ${{ steps.check.outputs.work_needed }}
      candidate_needed: ${{ steps.check.outputs.candidate_needed }}
      source_ref: ${{ steps.check.outputs.source_ref }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - id: check
        name: Validate inputs and require unused release state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REF_NAME_FULL: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, tomllib, urllib.error, urllib.parse, urllib.request

          expected_ref = f"refs/heads/{os.environ['DEFAULT_BRANCH']}"
          if os.environ["GITHUB_REF_NAME_FULL"] != expected_ref:
              raise SystemExit(
                  f"Releases may only run from the default branch ({expected_ref}). "
                  "Re-run workflow_dispatch with that branch selected."
              )
          requested_version = os.environ["REQUESTED_VERSION"]
          if requested_version != requested_version.strip() or not requested_version:
              raise SystemExit("The requested version must be a nonblank exact value.")
          requested_commit = os.environ["REQUESTED_COMMIT_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", requested_commit):
              raise SystemExit(
                  "The requested commit must be a full lowercase 40-character SHA."
              )
          if requested_commit != os.environ["COMMIT_SHA"]:
              raise SystemExit(
                  f"Requested commit {requested_commit} does not equal the selected "
                  f"default-branch commit {os.environ['COMMIT_SHA']}."
              )

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          package_name = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]["name"]
          manifest_version = json.loads(
              pathlib.Path("mcpb/manifest.json").read_text(encoding="utf-8")
          )["version"]
          if requested_version != version:
              raise SystemExit(
                  f"Requested version {requested_version!r} does not equal package "
                  f"version {version!r}."
              )
          if manifest_version != version:
              raise SystemExit(
                  f"Manifest version {manifest_version!r} does not equal package "
                  f"version {version!r}."
              )
          if package_name != "moneybird-mcp":
              raise SystemExit(f"Unexpected package name: {package_name!r}")

          pypi_url = (
              "https://pypi.org/pypi/"
              f"{urllib.parse.quote(package_name, safe='')}/json"
          )
          try:
              with urllib.request.urlopen(pypi_url, timeout=30) as response:
                  project = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              project = {"releases": {}}  # project does not exist on PyPI yet

          if version in project.get("releases", {}):
              raise SystemExit(
                  f"PyPI already contains version {version}. Versions are immutable; "
                  "refusing to overwrite, repair, or reuse it."
              )

          repository = os.environ["REPOSITORY"]
          github_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_object(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers=github_headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise

          tag = github_object(f"git/ref/tags/v{version}")
          github_release = github_object(f"releases/tags/v{version}")
          if tag is not None:
              raise SystemExit(
                  f"Tag v{version} already exists. Refusing to move or reuse it."
              )
          if github_release is not None:
              raise SystemExit(
                  f"A GitHub Release for v{version} already exists. Refusing to "
                  "overwrite or reuse it."
              )

          source_sha = requested_commit
          source_ref = requested_commit
          publish_needed = True
          tag_needed = True
          release_needed = True
          work_needed = True
          candidate_needed = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"publish_needed={str(publish_needed).lower()}\n")
              out.write(f"tag_needed={str(tag_needed).lower()}\n")
              out.write(f"release_needed={str(release_needed).lower()}\n")
              out.write(f"work_needed={str(work_needed).lower()}\n")
              out.write(f"candidate_needed={str(candidate_needed).lower()}\n")
              out.write(f"source_ref={source_ref}\n")
              out.write(f"source_sha={source_sha}\n")

          print(
              f"Validated new manual release: package={package_name} "
              f"version={version} source_sha={source_sha}"
          )
          PY

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: check
    if: needs.check.outputs.candidate_needed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.source_ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Assert checked-out release version
        run: python scripts/assert_release_version.py "${{ needs.check.outputs.version }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        env:
          MONEYBIRD_MCP_DATA_DIR: ${{ runner.temp }}/moneybird-mcp-state
        run: python -m pytest -q

  dependency-audit:
    name: Audit release dependency graph
    needs: check
    if: needs.check.outputs.candidate_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.source_sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Assert checked-out release version
        run: python scripts/assert_release_version.py "${{ needs.check.outputs.version }}"

      - name: Audit direct and resolved transitive dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r requirements.txt

  minimum-dependencies:
    name: Test release minimum dependencies
    needs: check
    if: needs.check.outputs.candidate_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.source_ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-minimum.txt

      - name: Assert checked-out release version
        run: python scripts/assert_release_version.py "${{ needs.check.outputs.version }}"

      - name: Install the lowest supported direct dependency versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-minimum.txt -r requirements.txt pytest

      - name: Run tests against the minimum dependency graph
        env:
          MONEYBIRD_MCP_DATA_DIR: ${{ runner.temp }}/moneybird-mcp-state
        run: python -m pytest -q

  build:
    name: Verify and build ${{ needs.check.outputs.version }}
    needs: [check, test, dependency-audit, minimum-dependencies]
    if: needs.check.outputs.candidate_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.source_ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Assert checked-out release version
        run: python scripts/assert_release_version.py "${{ needs.check.outputs.version }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest build twine cyclonedx-bom==7.3.1

      # Gate the publish on the suite even though ci.yml also runs it: this is the
      # last checkpoint before an immutable upload. Also covers the pyproject <->
      # mcpb/manifest.json version sync (PackagingVersionSyncTests).
      - name: Run tests
        env:
          MONEYBIRD_MCP_DATA_DIR: ${{ runner.temp }}/moneybird-mcp-state
        run: python -m pytest -q

      - name: Build byte-for-byte reproducible wheel and sdist
        run: python scripts/check_reproducible_build.py --output-dir dist

      - name: twine check
        run: python -m twine check dist/*

      - name: Assert no credentials or local state are packaged
        run: python scripts/check_dist_hygiene.py

      - name: Install wheel and sdist in clean environments
        run: python scripts/smoke_dist_install.py

      - name: Generate a reproducible CycloneDX SBOM
        run: >-
          python scripts/build_sbom.py
          --expected-version "${{ needs.check.outputs.version }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-dist-${{ needs.check.outputs.version }}
          path: dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-sbom-${{ needs.check.outputs.version }}
          path: sbom/

  artifact-test:
    name: artifact smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [check, build]
    if: needs.check.outputs.candidate_needed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.source_sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-dist-${{ needs.check.outputs.version }}
          path: dist/

      - name: Install and import the exact release wheel
        run: >-
          python scripts/smoke_dist_install.py
          --wheel-only
          --expected-version "${{ needs.check.outputs.version }}"

  create-tag:
    name: Create release tag at the tested commit
    needs: [check, build, artifact-test]
    if: needs.check.outputs.tag_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create lightweight tag at the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$SOURCE_SHA"

  verify-tag:
    name: Verify release tag source
    needs: [check, build, artifact-test, create-tag]
    if: >-
      always() &&
      needs.check.outputs.work_needed == 'true' &&
      (
        needs.check.outputs.candidate_needed != 'true' ||
        (
          needs.build.result == 'success' &&
          needs.artifact-test.result == 'success'
        )
      ) &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the current tag to resolve to the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          repository = os.environ["REPOSITORY"]

          def get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          current = get(f"git/ref/tags/v{os.environ['VERSION']}")["object"]
          while current["type"] == "tag":
              current = get(f"git/tags/{current['sha']}")["object"]
          if current["type"] != "commit" or current["sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit(
                  f"Release tag moved or points elsewhere: {current}; "
                  f"expected commit {os.environ['SOURCE_SHA']}"
              )
          print(f"Verified tag at {current['sha']}")
          PY

  publish-pypi:
    name: Publish to PyPI
    needs: [check, build, artifact-test, create-tag, verify-tag]
    if: >-
      always() &&
      needs.check.outputs.publish_needed == 'true' &&
      needs.build.result == 'success' &&
      needs.artifact-test.result == 'success' &&
      needs.verify-tag.result == 'success'
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI mints a short-lived token from this job's OIDC
    # identity, so there is no API token secret in the repo. The publisher on
    # pypi.org names this workflow file and this environment.
    environment:
      name: pypi
      url: https://pypi.org/p/moneybird-mcp
    permissions:
      id-token: write
      contents: read
    steps:
      # This executes only after any `pypi` environment reviewer approves the
      # job, closing the tag-movement window during the approval wait.
      - name: Re-verify tag immediately before PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          repository = os.environ["REPOSITORY"]

          def get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          current = get(f"git/ref/tags/v{os.environ['VERSION']}")["object"]
          while current["type"] == "tag":
              current = get(f"git/tags/{current['sha']}")["object"]
          if current["type"] != "commit" or current["sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit(
                  f"Release tag moved or points elsewhere: {current}; "
                  f"expected commit {os.environ['SOURCE_SHA']}"
              )
          print(f"Re-verified tag at {current['sha']}")
          PY

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-dist-${{ needs.check.outputs.version }}
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  collect-pypi:
    name: Verify exact PyPI artifacts
    needs: [check, build, artifact-test, verify-tag, publish-pypi]
    if: >-
      always() &&
      needs.check.outputs.work_needed == 'true' &&
      needs.verify-tag.result == 'success' &&
      (
        needs.check.outputs.candidate_needed != 'true' ||
        (
          needs.build.result == 'success' &&
          needs.artifact-test.result == 'success'
        )
      ) &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The dispatch guard proved github.sha is the exact requested default-
          # branch commit, so verification helpers and candidate source agree.
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install provenance and SBOM verification tooling
        run: >-
          python -m pip install
          pypi-attestations==0.0.30
          cyclonedx-bom==7.3.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.check.outputs.candidate_needed == 'true'
        with:
          name: candidate-dist-${{ needs.check.outputs.version }}
          path: candidate-dist/

      - name: Re-verify tag after any publication approval delay
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          repository = os.environ["REPOSITORY"]

          def get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          current = get(f"git/ref/tags/v{os.environ['VERSION']}")["object"]
          while current["type"] == "tag":
              current = get(f"git/tags/{current['sha']}")["object"]
          if current["type"] != "commit" or current["sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit(
                  f"Release tag moved or points elsewhere: {current}; "
                  f"expected commit {os.environ['SOURCE_SHA']}"
              )
          print(f"Re-verified tag at {current['sha']}")
          PY

      - name: Download and verify the exact published wheel and sdist
        env:
          CANDIDATE_NEEDED: ${{ needs.check.outputs.candidate_needed }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.error, urllib.request

          version = os.environ["VERSION"]
          release = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(
                      f"https://pypi.org/pypi/moneybird-mcp/{version}/json",
                      timeout=30,
                  ) as response:
                      release = json.load(response)
                  files = [
                      item for item in release["urls"]
                      if item["packagetype"] in {"bdist_wheel", "sdist"}
                      and not item.get("yanked")
                  ]
                  wheels = [
                      item for item in files
                      if item["packagetype"] == "bdist_wheel"
                  ]
                  sdists = [
                      item for item in files
                      if item["packagetype"] == "sdist"
                  ]
                  if len(wheels) == 1 and len(sdists) == 1:
                      files = wheels + sdists
                      break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              if attempt == 11:
                  raise SystemExit(
                      f"PyPI {version} did not expose exactly one wheel and one "
                      "sdist within the verification window"
                  )
              time.sleep(5)

          target_dir = pathlib.Path("dist")
          target_dir.mkdir(exist_ok=True)
          for item in files:
              target = target_dir / item["filename"]
              with urllib.request.urlopen(item["url"], timeout=60) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              expected = item["digests"]["sha256"]
              if digest != expected:
                  raise SystemExit(
                      f"Digest mismatch for {item['filename']}: {digest} != {expected}"
                  )
              target.write_bytes(data)
              print(f"Downloaded verified {target.name}: {digest}")

          if os.environ["CANDIDATE_NEEDED"] == "true":
              def package_files(directory):
                  return {
                      path.name: path
                      for path in pathlib.Path(directory).iterdir()
                      if path.name.endswith(".whl")
                      or path.name.endswith(".tar.gz")
                  }

              candidate_files = package_files("candidate-dist")
              pypi_files = package_files("dist")
              if set(candidate_files) != set(pypi_files):
                  raise SystemExit(
                      "Candidate/PyPI artifact names differ: "
                      f"{sorted(candidate_files)} != {sorted(pypi_files)}"
                  )
              for name, candidate in candidate_files.items():
                  candidate_digest = hashlib.sha256(
                      candidate.read_bytes()
                  ).hexdigest()
                  pypi_digest = hashlib.sha256(
                      pypi_files[name].read_bytes()
                  ).hexdigest()
                  if candidate_digest != pypi_digest:
                      raise SystemExit(
                          f"Candidate/PyPI digest mismatch for {name}: "
                          f"{candidate_digest} != {pypi_digest}"
                      )
                  print(
                      f"Candidate matches exact PyPI artifact {name}: "
                      f"{candidate_digest}"
                  )
          PY

      - name: Cryptographically verify PyPI publish attestations
        if: needs.check.outputs.publish_needed == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request

          with urllib.request.urlopen(
              f"https://pypi.org/pypi/moneybird-mcp/{os.environ['VERSION']}/json",
              timeout=30,
          ) as response:
              release = json.load(response)
          urls = [
              item["url"]
              for item in release["urls"]
              if item["packagetype"] in {"bdist_wheel", "sdist"}
              and not item.get("yanked")
          ]
          if len(urls) != 2:
              raise SystemExit(f"Expected two PyPI artifacts, found {len(urls)}")
          repository = f"https://github.com/{os.environ['REPOSITORY']}"
          for url in urls:
              subprocess.run(
                  [
                      "pypi-attestations",
                      "verify",
                      "pypi",
                      "--repository",
                      repository,
                      url,
                  ],
                  check=True,
              )
          print(f"Verified PyPI provenance for {len(urls)} artifacts from {repository}")
          PY

      - name: Assert no credentials or local state are packaged
        run: python scripts/check_dist_hygiene.py

      - name: Install exact PyPI wheel and sdist in clean environments
        run: >-
          python scripts/smoke_dist_install.py
          --expected-version "${{ needs.check.outputs.version }}"

      - name: Generate release SBOM from the exact published wheel
        run: >-
          python scripts/build_sbom.py
          --expected-version "${{ needs.check.outputs.version }}"
          --output-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-dist-${{ needs.check.outputs.version }}
          path: dist/

  tag-and-release:
    name: Create GitHub release
    needs: [check, collect-pypi]
    if: >-
      always() &&
      needs.check.outputs.release_needed == 'true' &&
      needs.collect-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-dist-${{ needs.check.outputs.version }}
          path: dist/

      - name: Re-verify tag immediately before release mutation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          repository = os.environ["REPOSITORY"]

          def get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          current = get(f"git/ref/tags/v{os.environ['VERSION']}")["object"]
          while current["type"] == "tag":
              current = get(f"git/tags/{current['sha']}")["object"]
          if current["type"] != "commit" or current["sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit(
                  f"Release tag moved or points elsewhere: {current}; "
                  f"expected commit {os.environ['SOURCE_SHA']}"
              )
          print(f"Re-verified tag at {current['sha']}")
          PY

      - name: Create release once with exact PyPI artifacts and SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release v$VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "v$VERSION" dist/* \
            --verify-tag \
            --title "v$VERSION" \
            --generate-notes

      - name: Verify final tag and GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          repository = os.environ["REPOSITORY"]

          def get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          current = get(f"git/ref/tags/v{os.environ['VERSION']}")["object"]
          while current["type"] == "tag":
              current = get(f"git/tags/{current['sha']}")["object"]
          if current["type"] != "commit" or current["sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit(
                  f"Final release tag mismatch: {current}; "
                  f"expected commit {os.environ['SOURCE_SHA']}"
              )

          release = get(f"releases/tags/v{os.environ['VERSION']}")
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("Final GitHub release is draft or prerelease")

          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in pathlib.Path("dist").iterdir()
              if path.name.endswith(".whl")
              or path.name.endswith(".tar.gz")
              or path.name.endswith(".cdx.json")
          }
          assets = {
              str(asset.get("name") or ""): asset
              for asset in release.get("assets", [])
              if str(asset.get("name") or "").endswith(".whl")
              or str(asset.get("name") or "").endswith(".tar.gz")
              or str(asset.get("name") or "").endswith(".cdx.json")
          }
          if set(assets) != set(expected):
              raise SystemExit(
                  f"Final package assets differ: {sorted(assets)} != "
                  f"{sorted(expected)}"
              )
          for name, digest in expected.items():
              actual = str(assets[name].get("digest") or "").lower()
              if actual != f"sha256:{digest}":
                  raise SystemExit(
                      f"Final GitHub digest mismatch for {name}: "
                      f"{actual} != sha256:{digest}"
                  )
          print(
              f"Final release verified at {current['sha']} with "
              f"{sorted(expected)}"
          )
          PY
