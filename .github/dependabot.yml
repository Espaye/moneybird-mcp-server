version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Multi-part actions must move as one commit. github/codeql-action/init and
    # .../analyze are separate Dependabot dependencies but the same released
    # action: a PR that bumps only one fails with "Loaded a configuration file
    # for version 'X', but running version 'Y'", so neither half can ever go
    # green on its own. Grouping every action update into a single PR keeps
    # such pairs atomic.
    groups:
      github-actions:
        patterns:
          - "*"
